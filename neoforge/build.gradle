plugins {
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}"
}

base {
    archivesName = "${archives_base_name}-neoforge"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java.srcDirs += [project(':common').file('src/main/java')]
        resources.srcDirs += [project(':common').file('src/main/resources')]
    }
}

def replaceProperties = [
    minecraft_version             : minecraft_version,
    minecraft_version_range       : minecraft_version_range,
    neoforge_version              : neoforge_version,
    neoforge_version_range        : neoforge_version_range,
    neoforge_loader_version_range : neoforge_loader_version_range,
    mod_id                        : mod_id,
    mod_name                      : mod_name,
    mod_version                   : mod_version,
    mod_description               : mod_description,
    mod_license                   : mod_license,
    mod_url_home                  : mod_url_home,
    mod_url_sources               : mod_url_sources,
    mod_url_issues                : mod_url_issues
]

tasks.named('processResources', ProcessResources).configure {
    from(rootProject.file('COPYING'))
    from(rootProject.file('COPYING.LESSER'))
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('compileJava') {
    dependsOn ':common:compileJava'
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'iChun, Ding Continuation',
            'Specification-Version'   : mod_version,
            'Implementation-Title'    : 'Ding Continuation (NeoForge)',
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : 'Ding Continuation',
            'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}
