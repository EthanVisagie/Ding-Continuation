plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = "${archives_base_name}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

sourceSets {
    main {
        java.srcDirs += [project(':common').file('src/main/java')]
        resources.srcDirs += [project(':common').file('src/main/resources')]
    }
}

def replaceProperties = [
    minecraft_version: minecraft_version,
    mod_id           : mod_id,
    mod_name         : mod_name,
    mod_version      : mod_version,
    mod_description  : mod_description,
    mod_license      : mod_license,
    mod_url_home     : mod_url_home,
    mod_url_sources  : mod_url_sources,
    mod_url_issues   : mod_url_issues
]

tasks.named('processResources', ProcessResources).configure {
    from(rootProject.file('COPYING'))
    from(rootProject.file('COPYING.LESSER'))
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('compileJava') {
    dependsOn ':common:compileJava'
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'iChun, Ding Continuation',
            'Specification-Version'   : mod_version,
            'Implementation-Title'    : 'Ding Continuation (Fabric)',
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : 'Ding Continuation'
        ])
    }
}
